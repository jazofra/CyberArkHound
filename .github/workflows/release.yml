name: Release

# Pushing a version tag (v1.2.3) builds the binaries, records build
# provenance, and publishes them with checksums as a GitHub release.
#
# Running the workflow by hand on main does the same for a new version:
# it builds main and creates the tag on that commit when it publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release from main, e.g. v1.2.3 (the tag must not exist yet)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the build provenance
      attestations: write  # store the build provenance
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A tag push releases that tag. A manual run releases main under a new
      # tag, so it refuses other branches, malformed versions and existing tags.
      - name: Resolve version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::Manual releases run only on main, not $REF."
              exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::version must look like v1.2.3."
              exit 1
            fi
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$INPUT_VERSION" > /dev/null || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::Tag $INPUT_VERSION already exists. Re-run its tag-push release instead."
              exit 1
            elif [ "$rc" -ne 2 ]; then
              echo "::error::Could not check whether tag $INPUT_VERSION exists (git exit $rc)."
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Release binaries are built with the latest stable Go so they carry
      # the newest standard-library security fixes.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/cyberarkhound_${VERSION}_${os}_${arch}${ext}" ./cmd/cyberarkhound
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cyberarkhound_*

      # A manual run creates the tag on the commit it built.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --verify-tag
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
